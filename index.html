<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pige des auteurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#00A05A;
    --green-ink:#007A45;
    --green-pale:#E9F6F0;
    --black:#0A0A0A;
    --grey:#8A8A8A;
    --hair:#DFDFDF;
    --sans:"Avenir Next","Avenir Next LT Pro",Avenir,Jost,"Segoe UI",system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    min-height:100%;
    display:flex;
    flex-direction:column;
    background:#fff;
    color:var(--black);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
    cursor:pointer;
    user-select:none;
  }
  body.is-busy{cursor:progress}

  /* la composition entière est centrée dans la fenêtre */
  .stage{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(1rem,3vh,2.5rem) clamp(1rem,4vw,3rem);
  }
  .sheet{
    width:min(1120px,100%);
    display:flex;
    flex-direction:column;
    gap:clamp(1.1rem,3.2vh,2.2rem);
  }

  /* ---------- la liste ---------- */
  .pool{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:.5rem;
  }
  .tag{
    display:inline-flex;
    align-items:baseline;
    gap:.5rem;
    padding:.5rem .9rem;
    border:1px solid var(--black);
    font-size:clamp(.92rem,1.45vw,1.28rem);
    font-weight:500;
    letter-spacing:-.01em;
    transition:background-color .1s,color .1s,border-color .1s,opacity .35s;
  }
  .tag__n{
    font-size:.62em;
    font-weight:500;
    letter-spacing:.06em;
    color:var(--grey);
  }
  .tag.is-cycling{background:var(--black);color:#fff;border-color:var(--black)}
  .tag.is-cycling .tag__n{color:#fff}
  .tag.is-hit{background:var(--green);color:#fff;border-color:var(--green)}
  .tag.is-hit .tag__n{color:#fff}
  .tag.is-taken{border-color:var(--hair);color:var(--hair);text-decoration:line-through;text-decoration-thickness:1px}
  .tag.is-taken .tag__n{color:var(--hair);text-decoration:none}
  .tag.is-left{border-color:var(--green);color:var(--green-ink)}
  .tag.is-left .tag__n{color:var(--green-ink)}

  /* ---------- les équipes ---------- */
  .teams{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:1px;
    background:var(--hair);
    border:1px solid var(--hair);
  }
  .team{
    background:#fff;
    padding:.8rem clamp(.55rem,1.1vw,1.05rem) .95rem;
    display:flex;
    flex-direction:column;
    gap:.5rem;
    transition:background-color .25s;
  }
  .team.is-next{background:var(--green-pale)}
  .team__name{
    font-size:.7rem;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--grey);
    border-bottom:1px dotted transparent;
    cursor:text;
  }
  .team__name:hover{border-bottom-color:var(--grey)}
  .team.is-next .team__name{color:var(--green-ink)}
  .team__name:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.2rem}
  .slot{
    min-height:2.2rem;
    display:flex;
    align-items:center;
    padding:.25rem 0;
    border-bottom:1px solid var(--hair);
    font-size:clamp(.85rem,1.12vw,1.06rem);
    font-weight:500;
    letter-spacing:-.01em;
    color:var(--hair);
  }
  .slot.is-filled{
    color:var(--black);
    animation:land .32s cubic-bezier(.2,1.3,.4,1) both;
  }
  @keyframes land{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

  .keys{
    margin:0;
    padding:.7rem clamp(1rem,4vw,3rem) .9rem;
    font-size:.66rem;
    font-weight:500;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--hair);
    display:flex;
    gap:1.4rem;
    flex-wrap:wrap;
  }
  .keys b{color:var(--grey);font-weight:600}
  .keys a{
    color:var(--grey);
    text-decoration:none;
    border-bottom:1px solid var(--hair);
    transition:color .15s,border-color .15s;
  }
  .keys a:hover{color:var(--green-ink);border-bottom-color:var(--green)}
  .keys a:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  @media (max-width:1080px){.teams{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:720px){.teams{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:460px){.teams{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<div class="stage">
  <div class="sheet">
    <main class="pool" id="pool" role="list" aria-label="Auteurs"></main>
    <section class="teams" id="teams" aria-label="Équipes"></section>
  </div>
</div>

<p class="keys">
  <span><b>Espace</b> ou clic · piger</span>
  <span><b>R</b> · recommencer</span>
  <span><b>C</b> · copier</span>
  <span><a href="seances.html">Pige des séances &rarr;</a></span>
</p>

<script>
(function () {
  "use strict";

  var AUTHORS = [
    "Taïeb Hafsi", "Kurt Lewin", "Christiane Demers", "Henry Mintzberg",
    "Cécile Bareil", "Dennis A. Gioia", "Andrew Pettigrew", "Peter Senge",
    "Andrew Van de Ven", "Karl E. Weick", "Eero Vaara", "James March",
    "Ann Langley", "Royston Greenwood", "Danny Miller", "Kevin Corley",
    "John P. Kotter", "Richard Whittington"
  ];
  var TEAM_COUNT = 5;
  var PER_TEAM = 3;

  var poolEl = document.getElementById("pool");
  var teamsEl = document.getElementById("teams");

  var tags = [], taken = [], results = [], current = 0, busy = false;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function randomBelow(n) {
    if (!window.crypto || !window.crypto.getRandomValues) return Math.floor(Math.random() * n);
    var limit = Math.floor(0xFFFFFFFF / n) * n, buf = new Uint32Array(1), v;
    do { window.crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
    return v % n;
  }

  function build() {
    taken = AUTHORS.map(function () { return -1; });
    results = [];
    current = 0;

    poolEl.innerHTML = "";
    tags = AUTHORS.map(function (nm, i) {
      var el = document.createElement("span");
      el.className = "tag";
      el.setAttribute("role", "listitem");
      el.innerHTML = '<span class="tag__n">' + pad(i + 1) + '</span><span></span>';
      el.lastChild.textContent = nm;
      poolEl.appendChild(el);
      return el;
    });

    teamsEl.innerHTML = "";
    for (var t = 0; t < TEAM_COUNT; t++) {
      results.push([]);
      var art = document.createElement("article");
      art.className = "team";
      art.dataset.t = String(t);
      var slots = "";
      for (var s = 0; s < PER_TEAM; s++) slots += '<li class="slot"></li>';
      art.innerHTML =
        '<span class="team__name" contenteditable="true" spellcheck="false" ' +
        'role="textbox" aria-label="Nom de l’équipe ' + (t + 1) + '">Équipe ' + (t + 1) + '</span>' +
        '<ol class="slots">' + slots + '</ol>';
      teamsEl.appendChild(art);
    }
    mark();
  }

  function remaining() {
    var out = [];
    for (var i = 0; i < taken.length; i++) if (taken[i] === -1) out.push(i);
    return out;
  }

  function mark() {
    var arts = teamsEl.querySelectorAll(".team");
    for (var t = 0; t < arts.length; t++) {
      arts[t].classList.toggle("is-next", t === current && current < TEAM_COUNT && !busy);
    }
  }

  function teamName(t) {
    var el = teamsEl.querySelector('.team[data-t="' + t + '"] .team__name');
    return (el.textContent || "").trim() || ("Équipe " + (t + 1));
  }

  async function drawOne(t, s) {
    var pool = remaining();
    var winner = pool[randomBelow(pool.length)];

    if (!reduceMotion && pool.length > 1) {
      var steps = 15 + randomBelow(5), delay = 40, last = null;
      for (var k = 0; k < steps; k++) {
        var pick = (k === steps - 1) ? winner : pool[randomBelow(pool.length)];
        if (last !== null) tags[last].classList.remove("is-cycling");
        tags[pick].classList.add("is-cycling");
        last = pick;
        await sleep(delay);
        delay = Math.min(delay * 1.17, 210);
      }
      if (last !== null) tags[last].classList.remove("is-cycling");
    }

    tags[winner].classList.add("is-hit");
    await sleep(reduceMotion ? 40 : 480);
    tags[winner].classList.remove("is-hit");
    tags[winner].classList.add("is-taken");

    taken[winner] = t;
    results[t].push(winner);

    var slot = teamsEl.querySelectorAll('.team[data-t="' + t + '"] .slot')[s];
    slot.classList.add("is-filled");
    slot.textContent = AUTHORS[winner];
  }

  async function pige() {
    if (busy || current >= TEAM_COUNT) return;
    busy = true;
    document.body.classList.add("is-busy");
    mark();

    var t = current;
    for (var s = 0; s < PER_TEAM; s++) {
      await drawOne(t, s);
      if (s < PER_TEAM - 1) await sleep(reduceMotion ? 40 : 260);
    }
    current++;

    busy = false;
    document.body.classList.remove("is-busy");
    mark();

    if (current >= TEAM_COUNT) {
      remaining().forEach(function (i) { tags[i].classList.add("is-left"); });
    }
  }

  function resultsText() {
    var lines = [];
    for (var t = 0; t < TEAM_COUNT; t++) {
      if (!results[t].length) continue;
      lines.push(teamName(t));
      results[t].forEach(function (i) { lines.push("  – " + AUTHORS[i]); });
      lines.push("");
    }
    if (current >= TEAM_COUNT) {
      lines.push("Non pigés : " + remaining().map(function (i) { return AUTHORS[i]; }).join(", "));
    }
    return lines.join("\n").trim();
  }

  function copyResults() {
    var text = resultsText();
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest(".team__name, a")) return;
    pige();
  });

  document.addEventListener("keydown", function (e) {
    if (document.activeElement && document.activeElement.isContentEditable) {
      if (e.key === "Enter") { e.preventDefault(); document.activeElement.blur(); }
      return;
    }
    if (e.code === "Space" || e.key === " ") { e.preventDefault(); pige(); return; }
    if (e.key === "r" || e.key === "R") {
      if (busy) return;
      if (current === 0 || window.confirm("Recommencer la pige ?")) build();
      return;
    }
    if (e.key === "c" || e.key === "C") { copyResults(); }
  });

  teamsEl.addEventListener("input", function (e) {
    if (e.target.classList.contains("team__name")) mark();
  });

  build();
})();
</script>
</body>
</html>
