<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pige des séances</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#00A05A;
    --green-ink:#007A45;
    --green-pale:#E9F6F0;
    --black:#0A0A0A;
    --grey:#8A8A8A;
    --hair:#DFDFDF;
    --sans:"Avenir Next","Avenir Next LT Pro",Avenir,Jost,"Segoe UI",system-ui,sans-serif;
  }

  *{box-sizing:border-box}
  html,body{height:100%}

  body{
    margin:0;
    min-height:100%;
    display:flex;
    flex-direction:column;
    background:#fff;
    color:var(--black);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.35;
    -webkit-font-smoothing:antialiased;
    cursor:pointer;
    user-select:none;
  }
  body.is-busy{cursor:progress}

  /* ---------- la liste ---------- */
  .pool{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:.5rem;
    width:min(780px,92vw);
    margin:0 auto;
    padding:clamp(1.2rem,4vh,3rem) 0;
  }
  .tag{
    display:flex;
    align-items:baseline;
    gap:1rem;
    padding:.7rem 1.1rem;
    border:1px solid var(--black);
    font-size:clamp(1rem,1.9vw,1.6rem);
    font-weight:500;
    letter-spacing:-.01em;
    transition:background-color .1s,color .1s,border-color .1s,opacity .35s;
  }
  .tag__n{
    font-size:.6em;
    font-weight:500;
    letter-spacing:.06em;
    color:var(--grey);
    flex:0 0 auto;
    min-width:5.4em;
  }
  .tag.is-cycling{background:var(--black);color:#fff;border-color:var(--black)}
  .tag.is-cycling .tag__n{color:#fff}
  .tag.is-hit{background:var(--green);color:#fff;border-color:var(--green)}
  .tag.is-hit .tag__n{color:#fff}
  .tag.is-taken{border-color:var(--hair);color:var(--hair);text-decoration:line-through;text-decoration-thickness:1px}
  .tag.is-taken .tag__n{color:var(--hair);text-decoration:none}

  /* ---------- les équipes ---------- */
  .teams{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:1px;
    background:var(--hair);
    border-top:1px solid var(--hair);
  }
  .team{
    background:#fff;
    padding:.9rem clamp(.6rem,1.2vw,1.2rem) 1.1rem;
    display:flex;
    flex-direction:column;
    gap:.55rem;
    transition:background-color .25s;
  }
  .team.is-next{background:var(--green-pale)}
  .team__name{
    font-size:.72rem;
    font-weight:600;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--grey);
    border-bottom:1px dotted transparent;
    cursor:text;
  }
  .team__name:hover{border-bottom-color:var(--grey)}
  .team.is-next .team__name{color:var(--green-ink)}
  .team__name:focus-visible{outline:2px solid var(--green);outline-offset:2px}

  .slot{
    min-height:4.2rem;
    display:flex;
    flex-direction:column;
    gap:.2rem;
    justify-content:center;
    padding:.35rem 0;
    border-bottom:1px solid var(--hair);
  }
  .slot__title{
    font-size:clamp(.88rem,1.2vw,1.12rem);
    font-weight:500;
    letter-spacing:-.01em;
    color:var(--hair);
  }
  .slot__when{
    font-size:.68rem;
    font-weight:500;
    letter-spacing:.09em;
    text-transform:uppercase;
    color:var(--hair);
  }
  .slot.is-filled{animation:land .32s cubic-bezier(.2,1.3,.4,1) both}
  .slot.is-filled .slot__title{color:var(--black)}
  .slot.is-filled .slot__when{color:var(--green-ink)}
  @keyframes land{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}

  .keys{
    padding:.7rem clamp(1rem,4vw,3rem) .9rem;
    font-size:.66rem;
    font-weight:500;
    letter-spacing:.13em;
    text-transform:uppercase;
    color:var(--hair);
    display:flex;
    gap:1.4rem;
    flex-wrap:wrap;
  }
  .keys b{color:var(--grey);font-weight:600}

  @media (max-width:1080px){.teams{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:720px){.teams{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:460px){.teams{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>

<main class="pool" id="pool" role="list" aria-label="Séances à animer"></main>

<section class="teams" id="teams" aria-label="Équipes"></section>

<p class="keys">
  <span><b>Espace</b> ou clic · piger</span>
  <span><b>R</b> · recommencer</span>
  <span><b>C</b> · copier</span>
</p>

<script>
(function () {
  "use strict";

  var SESSIONS = [
    { n: 9,  date: "11 novembre", title: "La perspective politique" },
    { n: 10, date: "18 novembre", title: "La perspective discursive" },
    { n: 11, date: "25 novembre", title: "La perspective de la pratique" },
    { n: 12, date: "2 décembre",  title: "La perspective culturelle" },
    { n: 13, date: "9 décembre",  title: "Des perspectives complémentaires" }
  ];
  var TEAM_COUNT = 5;

  var poolEl = document.getElementById("pool");
  var teamsEl = document.getElementById("teams");

  var tags = [], taken = [], results = [], current = 0, busy = false;
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function randomBelow(n) {
    if (!window.crypto || !window.crypto.getRandomValues) return Math.floor(Math.random() * n);
    var limit = Math.floor(0xFFFFFFFF / n) * n, buf = new Uint32Array(1), v;
    do { window.crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
    return v % n;
  }

  function build() {
    taken = SESSIONS.map(function () { return -1; });
    results = [];
    current = 0;

    poolEl.innerHTML = "";
    tags = SESSIONS.map(function (s) {
      var el = document.createElement("span");
      el.className = "tag";
      el.setAttribute("role", "listitem");
      el.innerHTML = '<span class="tag__n"></span><span></span>';
      el.firstChild.textContent = "Séance " + s.n;
      el.lastChild.textContent = s.title;
      poolEl.appendChild(el);
      return el;
    });

    teamsEl.innerHTML = "";
    for (var t = 0; t < TEAM_COUNT; t++) {
      results.push(-1);
      var art = document.createElement("article");
      art.className = "team";
      art.dataset.t = String(t);
      art.innerHTML =
        '<span class="team__name" contenteditable="true" spellcheck="false" ' +
        'role="textbox" aria-label="Nom de l’équipe ' + (t + 1) + '">Équipe ' + (t + 1) + '</span>' +
        '<div class="slot"><span class="slot__title">—</span><span class="slot__when"></span></div>';
      teamsEl.appendChild(art);
    }
    mark();
  }

  function remaining() {
    var out = [];
    for (var i = 0; i < taken.length; i++) if (taken[i] === -1) out.push(i);
    return out;
  }

  function mark() {
    var arts = teamsEl.querySelectorAll(".team");
    for (var t = 0; t < arts.length; t++) {
      arts[t].classList.toggle("is-next", t === current && current < TEAM_COUNT && !busy);
    }
  }

  function teamName(t) {
    var el = teamsEl.querySelector('.team[data-t="' + t + '"] .team__name');
    return (el.textContent || "").trim() || ("Équipe " + (t + 1));
  }

  async function pige() {
    if (busy || current >= TEAM_COUNT) return;
    var pool = remaining();
    if (!pool.length) return;

    busy = true;
    document.body.classList.add("is-busy");
    mark();

    var winner = pool[randomBelow(pool.length)];

    if (!reduceMotion && pool.length > 1) {
      var steps = 13 + randomBelow(4), delay = 46, last = null;
      for (var k = 0; k < steps; k++) {
        var pick = (k === steps - 1) ? winner : pool[randomBelow(pool.length)];
        if (last !== null) tags[last].classList.remove("is-cycling");
        tags[pick].classList.add("is-cycling");
        last = pick;
        await sleep(delay);
        delay = Math.min(delay * 1.19, 230);
      }
      if (last !== null) tags[last].classList.remove("is-cycling");
    }

    tags[winner].classList.add("is-hit");
    await sleep(reduceMotion ? 40 : 620);
    tags[winner].classList.remove("is-hit");
    tags[winner].classList.add("is-taken");

    var t = current;
    taken[winner] = t;
    results[t] = winner;

    var s = SESSIONS[winner];
    var slot = teamsEl.querySelector('.team[data-t="' + t + '"] .slot');
    slot.classList.add("is-filled");
    slot.querySelector(".slot__title").textContent = s.title;
    slot.querySelector(".slot__when").textContent = "Séance " + s.n + " · " + s.date;

    current++;
    busy = false;
    document.body.classList.remove("is-busy");
    mark();
  }

  function resultsText() {
    var rows = [];
    for (var t = 0; t < TEAM_COUNT; t++) {
      if (results[t] < 0) continue;
      var s = SESSIONS[results[t]];
      rows.push({ n: s.n, line: "Séance " + s.n + " · " + s.date + " — " + s.title + " : " + teamName(t) });
    }
    rows.sort(function (a, b) { return a.n - b.n; });
    return rows.map(function (r) { return r.line; }).join("\n");
  }

  function copyResults() {
    var text = resultsText();
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text);
    } else {
      var ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  document.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest(".team__name")) return;
    pige();
  });

  document.addEventListener("keydown", function (e) {
    if (document.activeElement && document.activeElement.isContentEditable) {
      if (e.key === "Enter") { e.preventDefault(); document.activeElement.blur(); }
      return;
    }
    if (e.code === "Space" || e.key === " ") { e.preventDefault(); pige(); return; }
    if (e.key === "r" || e.key === "R") {
      if (busy) return;
      if (current === 0 || window.confirm("Recommencer la pige ?")) build();
      return;
    }
    if (e.key === "c" || e.key === "C") { copyResults(); }
  });

  teamsEl.addEventListener("input", function (e) {
    if (e.target.classList.contains("team__name")) mark();
  });

  build();
})();
</script>
</body>
</html>
